<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Influencer Match 3 Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <div class="stats-container">
                <div class="stat">
                    <span class="stat-icon">🏆</span>
                    <span class="stat-label level-display">Level 1</span>
                </div>
                <div class="stat">
                    <span class="stat-icon">🎮</span>
                    <span class="stat-label moves-display">Moves: 0/20</span>
                </div>
            </div>
            
            <div class="score-container">
                <h2 class="score-display">Score: 0</h2>
                <div class="progress-bar-container">
                    <div class="progress-bar"></div>
                </div>
                <div class="target-score">Target: 1000</div>
            </div>
        </div>
        
        <div class="game-board">
            <!-- Game cells will be generated by JavaScript -->
        </div>
        
        <div id="level-complete" class="message-box hidden">
            <h2>Level Complete!</h2>
            <p>You've reached the target score!</p>
            <button id="next-level-btn">Next Level</button>
        </div>
        
        <div id="game-over" class="message-box hidden">
            <h2>Game Over</h2>
            <p>You didn't reach the target score.</p>
            <button id="try-again-btn">Try Again</button>
        </div>
        
        <div id="game-restart" class="restart-container">
            <button id="restart-btn">Restart</button>
        </div>
        
        <div class="brand-footer">
            <p class="brand-name">INFLUEBRAND</p>
            <p class="brand-tag">The Influencer Match Game</p>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
